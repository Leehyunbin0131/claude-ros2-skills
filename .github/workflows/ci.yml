name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1" # weekly: catch link rot

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile scripts
        run: |
          python3 -m compileall -q skills scripts tests evals/harness evals/development evals/workflow_value
          for file in evals/harness/*.sh; do bash -n "$file"; done
      - name: Unit tests (pure logic, no ROS required)
        run: python3 skills/ros2-troubleshooting/scripts/test_checks.py
      - name: Installation and protocol transport
        run: python3 tests/test_install.py
      - name: Development evidence gate
        run: |
          python3 tests/test_development.py
          python3 tests/test_evidence.py
          python3 evals/development/test_runner.py
          python3 evals/workflow_value/test_runner.py
          python3 evals/workflow_value/test_oracle.py
      - name: Install isolated package-workflow test tools
        run: python3 -m pip install colcon-common-extensions==0.3.0
      - name: Real Python and CMake package workflow
        run: python3 tests/test_colcon_workflow.py
      - name: Evaluation harness regressions
        run: |
          python3 evals/harness/grade_v2.py --selftest
          python3 evals/harness/test_harness.py

  ros:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4
      - name: Install message, TF and package-test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ros-jazzy-tf2-ros ros-jazzy-sensor-msgs ros-jazzy-nav-msgs ros-jazzy-launch-testing ros-jazzy-ament-cmake-pytest ros-jazzy-ament-cmake-gtest ros-jazzy-rosidl-default-generators python3-colcon-common-extensions python3-pytest cmake g++
      - name: Synthetic ROS integration checks (no hardware)
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          python3 tests/test_ros_checks.py
      - name: Package tests with the sourced Jazzy environment
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          python3 tests/test_colcon_workflow.py
          python3 tests/test_ament_test_results.py
      - name: Acceptance oracle positive and negative controls (no model calls)
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          python3 evals/development/test_oracles.py
          ROS2_ACCEPTANCE_SEED=1 python3 evals/development/test_oracles.py
      - name: Workflow usefulness oracle controls (no model calls)
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          WV_ORACLE_CONTROLS=1 WV_SEEDS=0 python3 evals/workflow_value/test_oracle.py

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check documentation links
        uses: lycheeverse/lychee-action@v2
        with:
          # evals/runs/ is excluded on purpose. Those files are transcripts of
          # what a test cell actually did, including every URL it tried — some
          # truncated by the summariser, some needing auth, some 404 because
          # the agent guessed wrong. That is the measurement, not link rot, and
          # the files are immutable records nobody navigates from. Checking
          # them makes the job fail on data it is not allowed to fix.
          args: >-
            --no-progress --max-retries 3 --accept 200,429
            --exclude-path evals/runs
            "**/*.md"
          fail: true
