controller_server:
  ros__parameters:
    # Controller server general settings
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # Progress checker
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    # Goal checker
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: true

    # MPPI Controller
    FollowPath:
      plugin: "mppi_controller::MPPIController"

      # Model parameters
      model_name: "DiffDriveROS"
      batch_size: 2000
      time_steps: 25

      # Velocity constraints
      max_velocity: [0.5, 0.0]
      min_velocity: [-0.5, 0.0]
      max_angular_velocity: 1.0

      # Acceleration limits
      max_accel: [1.0, 0.0]
      max_decel: [-1.0, 0.0]
      max_angular_accel: 2.0

      # Costs configuration
      temperature: 0.1
      gamma: 0.015

      # Obstacle cost settings
      cost_weights:
        obstacle_cost_weight: 35.0
        velocity_cost_weight: 0.0
        goal_cost_weight: 5.0
        terminal_cost_weight: 5.0
        steering_input_weight: 1.0
        velocity_input_weight: 0.0

      # Smoothing settings
      input_cost_weight: 1.0
      reference_cost_weight: 5.0

      # Critics (cost functions)
      critics:
        - ConstraintCritic
        - CollisionCritic
        - GoalCritic
        - PathFollowingCritic
        - PreferForwardCritic

      # ConstraintCritic
      constraints:
        max_velocity: 0.5
        min_velocity: -0.5
        max_angular_velocity: 1.0

      # CollisionCritic
      collision_cost: 35.0
      collision_margin_distance: 0.10
      min_occupied_cost_value: 100
      trajectory_step_size: 0.05
      point_downsampling: 2
      consider_footprint: false

      # GoalCritic
      goal_weight: 5.0
      goal_distance: 0.5

      # PathFollowingCritic
      path_follow_weight: 5.0
      path_point_step: 0.1

      # PreferForwardCritic
      prefer_forward_weight: 0.0

      # Costmap settings
      downsample_costmap: false
      costmap_downsampling_st: 1

      # Noise settings
      noise_std_dev: [0.1, 0.0, 0.2]

      # Resampling settings
      resample_interval: 1

      # Iteration settings
      num_iterations: 1

      # Priors
      motion_model_dt: 0.1

      # Trajectory settings
      trajectory_step: 0.05

      # Obstacle inflation layer
      use_obstacle_layer: true

      # Differential drive specific
      is_holonomic: false

      # Trajectory constraints
      trajectory_time: 2.5

# Launch file would use:
# ros2 launch nav2_bringup navigation_launch.py params_file:=controller_server.yaml
