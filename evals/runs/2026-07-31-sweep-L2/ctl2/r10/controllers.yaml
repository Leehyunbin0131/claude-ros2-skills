controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    position_controller:
      type: forward_command_controller/ForwardCommandController

joint_state_broadcaster:
  ros__parameters:
    joints:
      - joint_a
      - joint_b
    interfaces:
      - position
      - velocity

position_controller:
  ros__parameters:
    joints:
      - joint_a
      - joint_b
    interface_name: position
